[project]
name = "fantasy-agent"
version = "0.1.0"
description = "Multi-agent system for writing fantasy novels chapter by chapter"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "litellm>=1.50",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
fantasy-agent = "fantasy_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fantasy_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
